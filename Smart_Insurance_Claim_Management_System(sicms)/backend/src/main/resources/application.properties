server.port=8080
spring.application.name=sicms

# ---------- Database (H2 in-memory for development) ----------
spring.datasource.url=jdbc:h2:mem:sicms;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- File uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=./uploads

# ---------- Security (JWT) ----------
# Change this secret for any shared / production environment (min 32 characters)
app.jwt.secret=change-me-sicms-super-secret-key-2026-please-change
app.jwt.expiration-minutes=480

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
